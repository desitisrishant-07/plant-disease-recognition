<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — PlantCare AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b'}}}}}</script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-emerald-50/20 to-teal-50/40 min-h-screen text-slate-800 flex flex-col font-sans antialiased">
    {% include 'partials/header.html' %}
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-2xl bg-brand-100 text-brand-600 flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fa-solid fa-user-plus"></i></div>
                <h2 class="text-2xl font-extrabold text-slate-900">Create Your Account</h2>
                <p class="text-sm text-slate-500 mt-1">Join PlantCare AI and track your plant health</p>
            </div>
            <form method="POST" action="/signup" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Full Name</label>
                    <input type="text" name="name" required placeholder="John Doe" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white text-sm">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Email</label>
                    <input type="email" name="email" required placeholder="john@example.com" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white text-sm">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Password</label>
                    <input type="password" name="password" required minlength="6" placeholder="Min 6 characters" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white text-sm">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Confirm Password</label>
                    <input type="password" name="confirm" required minlength="6" placeholder="Repeat password" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white text-sm">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-teal-600 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg hover:from-brand-700 hover:to-teal-700 transition-all text-sm uppercase tracking-wider">
                    Create Account <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
            <p class="text-center text-sm text-slate-600 mt-5">Already registered? <a href="/login" class="text-brand-600 font-bold hover:underline">Log in</a></p>
        </div>
    </main>
    <footer class="bg-white border-t border-slate-200/80 py-6 text-center text-sm text-slate-500">&copy; 2026 PlantCare AI.</footer>
</body>
</html>
